# Workspace root for the Personal Learning OS desktop app.
#
# members:
#   .              — main Tauri app (this crate)
#   llama-helper   — sidecar inference process (llama.cpp via llama-cpp-2),
#                    spawned by the app to run local LLMs (see docs/local-llm-loading-plan-2026-09.md)
[workspace]
resolver = "2"
members = ["llama-helper"]

[package]
name = "personal-learning-os"
version = "0.1.0"
description = "Local-first AI learning system — Tauri shell"
authors = ["JackXuyi"]
edition = "2021"

# The library is consumed by src/main.rs (desktop) and the mobile entry point.
[lib]
name = "personal_learning_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "macros", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
# 网页抓取（net.rs）的字节回传编码。0.22.1 本就是 reqwest 的传递依赖
# （见 Cargo.lock），此处只是提升为直接依赖 ⇒ 零新增 crate。
base64 = "0.22"
# RAG 存储层（T5–T6）：SQLite + FTS5 全文检索。
# 用 query() 运行时 SQL 而非 query!() 宏，故不依赖 DATABASE_URL（离线可编译）；
# macros 仍需要——models.rs 用 `#[derive(sqlx::FromRow)]` 做行映射。
# bundled SQLite 自带 FTS5；runtime-tokio 与既有 tokio 依赖对齐。
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# 扫描件 OCR（ocr.rs）—— 用系统 Vision 框架，免模型分发。
# 按平台限定：Vision 只在 macOS 存在，其它平台编译不引入（回 unsupported-os）。
# ⚠️ 必须关掉默认 features：默认全开会把 objc2-av-foundation / core-audio /
# core-media / core-ml / core-video / image-io 一起拖进来（8 个包），
# 而本条命令只用到「文字识别」这一小块。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = { version = "0.3", default-features = false, features = [
  "std",
  "VNRecognizeTextRequest",
  "VNRequest",
  "VNRequestHandler",
  "VNObservation",
] }
